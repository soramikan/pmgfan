# pmgfand 設定ファイル例
# インストール先: /etc/pmgfand/config.toml
# 設計の詳細は docs/08-config.md を参照

[device]
model = "PRIMERGY TX1320 M4"
backend = "ipmitool"
interface = "open"

[monitor]
fan_interval_ms = 2000
temperature_interval_ms = 1000
history_seconds = 900  # TUI スパークライン用（Phase 6・現在未使用）

[control]
mode = "curve"

# 強制 PWM の適用範囲。
#   "all"     全ファン（PSU 電源ファンを含む）
#   "chassis" FAN CPU / FANx SYS のみ。PSU ファンは iRMC 自動制御に残る。
#             PSU は PWM→RPM の特性が急峻で（30% で ~5600RPM）、
#             Auto では ~1600RPM まで落ちるため、静音目的ならこちら。
pwm_scope = "chassis"

# 強制 PWM の許可範囲。min を 30 未満に下げられる（実機では
# 0% でもシャーシファンはハードウェアフロア ~775RPM で回転継続）。
# 低くしすぎると冷却余力が減る点に注意。
min_pwm = 10
max_pwm = 100

step_up = 20
step_down = 5
down_hysteresis = 5
min_apply_interval_ms = 5000

[safety]
sensor_stale_seconds = 10  # 非空温度データの鮮度期限。超過で fail_action 発動
ipmi_failure_limit = 3

# 緊急温度。超過時はモードに関わらず 100% PWM を強制し Failsafe 状態へ
cpu_emergency = 90
pch_emergency = 95

fail_action = "irmc-auto"  # 監視系フェイル時: "irmc-auto"（解除）or "full-speed"（100% 強制）

[[curve]]
sensor = "cpu_package"

points = [
    [35, 30],
    [50, 35],
    [60, 45],
    [70, 60],
    [80, 80],
    [90, 100],
]

[[curve]]
sensor = "pch"

points = [
    [45, 30],
    [60, 35],
    [70, 45],
    [80, 65],
    [90, 100],
]

# Target RPM（PI 制御）。`mode = "target_rpm"` の起動値と、
# TUI/CLI で Target RPM を選んだときに使う PI 係数。
# 参照ファンが読めなくなると自動で iRMC Auto へ退避する。
[target_rpm]
reference_fan = "FAN CPU"
target = 2500

kp = 0.003      # PWM% per RPM 誤差（比例）
ki = 0.0001     # PWM% per RPM·tick（積分）
deadband = 75   # |誤差| がこの RPM 以内なら PWM を変えない

# PI 出力の範囲。未指定なら [control] の min_pwm/max_pwm を使う。
# min_pwm = 10
# max_pwm = 100
